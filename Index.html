 <body>
  <div id="gameContainer">
   <div class="row">
    <iframe id="game-iframe" src="" webkit-playsinline="true" scrolling="no" frameborder="0" allow="autoplay"></iframe>
   </div>
  </div>

  <style>
    * { padding: 0; margin: 0; }

    body {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #333333;
    }

    #gameContainer * { display: flex; }

    #gameContainer {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    .row {
      flex: 1;
      background-color: #333333;
      width: 100%;
      position: relative;
    }

    #game-iframe {
      flex: 1;
      background-color: #333333;
    }

    /* Transparent layer: catches the first click on the game */
    #clickGate {
      position: absolute;
      inset: 0;
      z-index: 9999;
      cursor: pointer;
      background: transparent;
    }
  </style>

  <script>
  (function(){
    const packageId = "archery-world-tour";
    let affiliateId = "A1000-10";
    const iframe = document.querySelector("#game-iframe");
    if (affiliateId == "A1000-10") {
      affiliateId += (Math.random() >= 0.5) ? "A" : "B";
    }
    if(iframe) {
      iframe.setAttribute("src", 'https://play.famobi.com/' + packageId + "/" + affiliateId);
    }
  })();
  </script>

  <!-- Ad tag 1 -->
  <script>(function(s){s.dataset.zone='12056311',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

  <!-- Ad tag 2 (on click) -->
  <script src="https://quge5.com/88/tag.min.js" data-zone="297359" async data-cfasync="false"></script>

  <!-- First click on the game triggers the on-click ad, then the layer removes itself -->
  <script>
  (function () {
    var row = document.querySelector('.row');
    var gate = document.createElement('div');
    gate.id = 'clickGate';
    row.appendChild(gate);
    gate.addEventListener('click', function () {
      gate.remove();
    });
  })();
  </script>
